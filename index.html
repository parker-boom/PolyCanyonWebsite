<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#376d31" />
    <link rel="icon" href="/favicon.png" />
    <script>
      document.documentElement.classList.add('app-booting');
      window.addEventListener(
        'error',
        (event) => {
          if (event.target instanceof HTMLScriptElement)
            document.documentElement.classList.remove('app-booting');
        },
        true
      );
      window.setTimeout(
        () => document.documentElement.classList.remove('app-booting'),
        8000
      );
    </script>
    <style>
      html {
        background: #fafbf8;
      }
      html.app-booting [data-static-page] {
        display: none;
      }
    </style>
    <!-- page-metadata:start -->
    <title>Poly Canyon — Explore the Structures</title>
    <meta
      name="description"
      content="Explore Cal Poly’s student-built architectural laboratory. Discover its structures, history, and the information you need for a visit."
    />
    <link rel="canonical" href="https://polycanyon.com/" />
    <!-- page-metadata:end -->
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >Explore the history of Poly Canyon, Cal Poly’s outdoor architectural
      laboratory. Enable JavaScript to browse the interactive structure
      archive.</noscript
    >
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
